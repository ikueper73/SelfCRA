# Default: single container with SQLite on a named volume and in-app accounts.
#   INITIAL_ADMIN_EMAIL=you@example.com INITIAL_ADMIN_PASSWORD='a-long-password' docker compose up -d
# With PostgreSQL instead of SQLite:
#   DATABASE_URL=postgres://cra:cra@db:5432/cra docker compose --profile postgres up -d
services:
  app:
    build: .
    image: cra-risk-assessment:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:/data/cra.db}
      AUTH_MODE: ${AUTH_MODE:-local}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AUTH_HEADER: ${AUTH_HEADER:-x-forwarded-user}
      ROLE_SOURCE: ${ROLE_SOURCE:-app}
      VULN_LOOKUP: ${VULN_LOOKUP:-on}
      NVD_API_KEY: ${NVD_API_KEY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-}
      PGSSLMODE: ${PGSSLMODE:-disable}
    volumes:
      - cra-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: cra
      POSTGRES_PASSWORD: cra
      POSTGRES_DB: cra
    volumes:
      - cra-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  cra-data:
  cra-pg:
